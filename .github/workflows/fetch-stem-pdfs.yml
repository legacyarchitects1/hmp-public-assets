name: fetch-stem-pdfs
on:
  push:
    paths: ['.github/workflows/fetch-stem-pdfs.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download Student and Teacher PDFs from storage
        run: |
          set -e
          mkdir -p out
          B=https://bazwnitzxtbvztqnmdfs.supabase.co/storage/v1/object/public/podcast-audio/ebooks/stem-course
          curl -fsSL -o out/student.pdf "$B/master-stem-course-student-edition.pdf"
          curl -fsSL -o out/teacher.pdf "$B/master-stem-course-complete-guide.pdf"
          ls -la out
          head -c 4 out/student.pdf | grep -q '%PDF'
          head -c 4 out/teacher.pdf | grep -q '%PDF'
      - name: Push to transfer branch
        run: |
          cd out
          git init -q -b pdf-transfer
          git config user.name "hmp-bot"; git config user.email "hmp-bot@users.noreply.github.com"
          git add student.pdf teacher.pdf
          git commit -qm "transfer STEM PDFs"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" pdf-transfer
