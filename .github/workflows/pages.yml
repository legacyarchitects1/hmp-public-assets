name: Publish STEM course to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
          # GitHub's built-in token cannot switch Pages on. If Pages is still off,
          # add a fine-grained token (Administration + Pages: read/write) as the
          # repo secret PAGES_ADMIN_TOKEN and this step turns Pages on by itself.
          token: ${{ secrets.PAGES_ADMIN_TOKEN || github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
